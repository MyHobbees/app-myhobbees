          AWS__TFSTATE_REGION: ${{ secrets.AWS__TFSTATE_REGION }}
          TF_PRD__AWS_ACCESS_KEY: ${{ secrets.TF_PRD__AWS_ACCESS_KEY }}
          TF_PRD__AWS_SECRET_KEY: ${{ secrets.TF_PRD__AWS_SECRET_KEY }}

  terraform-database-prd:
    name: Terraform Database (prd)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install boto3
      - name: Install tfenv
        run: |
          git clone https://github.com/tfutils/tfenv.git ~/.tfenv
          echo "$HOME/.tfenv/bin" >> $GITHUB_PATH
      - name: Run Terraform
        run: python3.14 infrastructure/scripts/terraform.py database prd
        env:
          AWS__TFSTATE_BUCKET: ${{ secrets.AWS__TFSTATE_BUCKET }}
          AWS__TFSTATE_REGION: ${{ secrets.AWS__TFSTATE_REGION }}
          TF_PRD__AWS_ACCESS_KEY: ${{ secrets.TF_PRD__AWS_ACCESS_KEY }}
          TF_PRD__AWS_SECRET_KEY: ${{ secrets.TF_PRD__AWS_SECRET_KEY }}
          TF_PRD__DB_PASSWORD: ${{ secrets.TF_PRD__DB_PASSWORD }}

  terraform-api-prd:
    name: Terraform API (prd)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
